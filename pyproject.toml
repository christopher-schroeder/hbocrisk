[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hbocrisk"
version = "0.1.0"
description = "Open re-implementation of the BOADICEA (v6) breast cancer and CanRisk ovarian cancer risk models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Schröder", email = "christopher.schroeder@tu-dortmund.de" }]
keywords = ["BOADICEA", "CanRisk", "breast cancer", "ovarian cancer", "risk prediction", "polygenic risk score"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/christopher-schroeder/hbocrisk"
Repository = "https://github.com/christopher-schroeder/hbocrisk.git"
Issues = "https://github.com/christopher-schroeder/hbocrisk/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hbocrisk = "hbocrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hbocrisk = ["data/incidences/*.json", "data/prs/*.prs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

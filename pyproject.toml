[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openboadicea"
version = "0.1.0"
description = "Open re-implementation of the BOADICEA (v6) breast cancer and CanRisk ovarian cancer risk models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Christopher Schröder", email = "christopher.schroeder@tu-dortmund.de" }]
keywords = ["BOADICEA", "CanRisk", "breast cancer", "ovarian cancer", "risk prediction", "polygenic risk score"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/christopher-schroeder/openboadicea"
Repository = "https://github.com/christopher-schroeder/openboadicea.git"
Issues = "https://github.com/christopher-schroeder/openboadicea/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
openboadicea = "openboadicea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openboadicea = ["data/incidences/*.json", "data/prs/*.prs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
